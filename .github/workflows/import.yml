name: Import earlier releases
on: push
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Copy every release, oldest first
        run: |
          src=SamoVR/RiftEngine-src
          dst=SamoVR/RiftEngine
          tags=$(gh api "repos/$src/releases?per_page=50" --jq '.[].tag_name' | tac)
          for tag in $tags; do
            gh release view "$tag" --repo "$dst" >/dev/null 2>&1 && continue
            rm -rf assets && mkdir assets
            gh release download "$tag" --repo "$src" --dir assets
            gh api "repos/$src/releases/tags/$tag" --jq '.body' > notes.md
            name=$(gh api "repos/$src/releases/tags/$tag" --jq '.name')
            pre=$(gh api "repos/$src/releases/tags/$tag" --jq '.prerelease')
            flag=""; [ "$pre" = "true" ] && flag="--prerelease"
            gh release create "$tag" assets/* --repo "$dst" --title "$name" --notes-file notes.md --target main $flag
          done

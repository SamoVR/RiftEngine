# Publishes website/ to the gh-pages branch, which GitHub Pages serves at
# https://samovr.github.io/RiftEngine/. The site reads the latest release
# from the GitHub API, so a new release shows up without deploying again.
name: Website

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push website/ to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix website -b gh-pages-new
          git push --force origin gh-pages-new:gh-pages

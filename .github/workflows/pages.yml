# Publishes website/ to GitHub Pages (https://samovr.github.io/RiftEngine/).
#
# Repository Settings > Pages > Source: "Deploy from a branch", branch
# gh-pages, folder / (root). This workflow copies website/ onto that branch
# whenever website/ changes on main; GitHub then publishes it in a minute.
# The site reads releases from the GitHub API, so a new release shows up
# without deploying again.
name: Website

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy website/ to the gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix website -b gh-pages-new
          git push --force origin gh-pages-new:gh-pages
